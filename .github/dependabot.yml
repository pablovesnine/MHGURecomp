version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /tools/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-base:
        patterns: ['*']
