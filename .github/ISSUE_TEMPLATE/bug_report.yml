name: Linux ARM64 bug report
description: A build or device problem in the Linux ARM64 fork.
body:
  - type: markdown
    attributes:
      value: |
        This fork supports Linux ARM64 through a Docker cross-build on x86_64 Linux.
        Report ARM64 problems here, not to the upstream maintainer.
        Try a clean profile without mods or cheats when possible.
        Do not attach game data, mhgugame.so, generated sources, caches or saves.
  - type: dropdown
    id: mods
    attributes:
      label: Were any mods installed?
      description: Turning them all off in the Mods tab of the settings menu (F1), or moving your `mods` folder away, and trying again is the quickest way to find out.
      options:
        - "No, it happens with no mods installed"
        - "Yes, but it also happens with all mods turned off"
        - "Yes, and it only happens with mods on"
        - "Yes, haven't tried without them / not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Full source commit SHA and local version label
      description: Use git rev-parse HEAD in the build checkout.
      placeholder: "Full 40-character SHA; local label 0.13.0"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - Docker image preparation
        - Public ARM64 checks without a dump
        - Private local game build or packaging
        - Running on an ARM64 Linux device
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Build host and ARM64 device
      description: Include host distro, Docker version/rootless status, device distro/kernel, GPU and driver.
      placeholder: "Host Fedora x86_64; device Odin 3, ArmadaOS, kernel and Vulkan driver versions"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Attach redacted terminal output or log.txt. A desktop launch writes log.txt
        beside mhgurecomp; a terminal launch normally writes to stderr.
        Copy the log immediately after the problem. Remove personal paths,
        network addresses, names and any private game data before sharing.
    validations:
      required: false
