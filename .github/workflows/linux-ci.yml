name: Linux ARM64 CI and master tools publication

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-builder.yml
    # Explicitly no candidate: ordinary PRs test github.sha's merge commit.
    with:
      candidate_ref: ''

  publish:
    name: Publish the same tested master tools image
    needs: validate
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.repository == 'pablovesnine/MHGURecomp' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # No checkout, candidate scripts, rebuild or container execution here.
      # Keep this job OUTSIDE the reusable validator: a read-only sync caller
      # cannot grant a nested workflow packages:write, even to a skipped job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-tools-${{ needs.validate.outputs.source_sha }}
          path: ${{ runner.temp }}/tested-image
      - name: Verify source, load image, publish and confirm digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TESTED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          gzip -dc "$RUNNER_TEMP/tested-image/tools-image.tar.gz" | docker image load
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{.Id}}')" == "$TESTED_IMAGE_ID" ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$SOURCE_SHA" ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" == https://github.com/pablovesnine/MHGURecomp ]]
          current=$(gh api repos/pablovesnine/MHGURecomp/git/ref/heads/master --jq .object.sha)
          [[ "$current" == "$SOURCE_SHA" ]]
          image=ghcr.io/pablovesnine/mhgurecomp-builder
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker image tag mhgurecomp-builder:ci "$image:$SOURCE_SHA"
          docker image push "$image:$SOURCE_SHA" | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n 1 | cut -d' ' -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$remote" == "$digest" ]]
          echo "Published \`$image:$SOURCE_SHA\` at \`$digest\` (same tested image ID: \`$TESTED_IMAGE_ID\`)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
