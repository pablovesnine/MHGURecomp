name: Linux fork checks and manual ARM64 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-builder.yml
    with:
      # The reusable builder runs quick checks once before ARM64 validation.
      candidate_ref: ''

  publish:
    needs: validate
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.repository == 'pablovesnine/MHGURecomp' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      statuses: read
      packages: write
    uses: ./.github/workflows/linux-publisher.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      image_id: ${{ needs.validate.outputs.image_id }}
      artifact_name: ${{ needs.validate.outputs.artifact_name }}
