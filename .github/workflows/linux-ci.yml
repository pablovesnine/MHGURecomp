name: Linux fork checks and manual ARM64 validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-checks.yml

  validate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-builder.yml
    with:
      # Full tools validation is explicit; ordinary changes use quick checks.
      candidate_ref: ''

  publish:
    needs: validate
    if: >-
      needs.validate.outputs.publish == 'true' &&
      github.repository == 'pablovesnine/MHGURecomp' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      statuses: read
      packages: write
    uses: ./.github/workflows/linux-publisher.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      image_id: ${{ needs.validate.outputs.image_id }}
      artifact_name: ${{ needs.validate.outputs.artifact_name }}
