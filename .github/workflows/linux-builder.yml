name: Linux ARM64 validation

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Exact candidate commit SHA; empty for ordinary CI
        type: string
        required: false
        default: ''
    outputs:
      source_sha:
        description: Exact checked-out and tested revision
        value: ${{ jobs.check.outputs.source_sha }}
      publish:
        description: Whether this is a genuine master push/manual run without a candidate
        value: ${{ jobs.check.outputs.publish }}
      image_id:
        description: ID of the transported tested image
        value: ${{ jobs.check.outputs.image_id }}
      artifact_name:
        description: Artifact containing exactly the tested tools image
        value: ${{ jobs.check.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ inputs.candidate_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-checks.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref }}

  check:
    needs: quick
    name: AArch64 without game data (amd64 host)
    # Bot candidates are tested by upstream-sync's explicit reusable call,
    # not by a token-generated PR event (which may await approval).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'bot/upstream-sync' ||
      github.event.sender.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.source.outputs.publish }}
      image_id: ${{ steps.image.outputs.id }}
      artifact_name: tested-tools-${{ steps.source.outputs.sha }}
    steps:
      - name: Require exact reusable candidate SHA
        env:
          CANDIDATE: ${{ inputs.candidate_ref }}
        run: |
          if [[ -n "$CANDIDATE" && ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_ref must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the synthetic merge commit on pull_request, not head.sha.
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - name: Record the exact checked-out source
        id: source
        env:
          CANDIDATE: ${{ inputs.candidate_ref }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          expected=${CANDIDATE:-$EVENT_SHA}
          [[ "$sha" == "$expected" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ -z "$CANDIDATE" && "$REF" == refs/heads/master &&
                "$REPOSITORY" == pablovesnine/MHGURecomp &&
                ( "$EVENT" == push || "$EVENT" == workflow_dispatch ) ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Export private tracked tools context
        id: context
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          umask 077
          context=$(mktemp -d "$RUNNER_TEMP/tools-context.XXXXXX")
          git archive "$SOURCE_SHA" tools |
            tar --no-same-permissions --no-same-owner -x -C "$context"
          for source in requirements.txt docker/prepare-sysroot.sh docker/normalize-sysroot.py \
                        docker/build.sh docker/check-elf.py; do
            [[ $(stat -c '%a' "$context/tools/$source") == 600 ]]
          done
          [[ $(stat -c '%a' "$context/tools/docker") == 700 ]]
          echo "path=$context" >> "$GITHUB_OUTPUT"
      - name: Build the tools image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.context.outputs.path }}/tools
          file: ${{ steps.context.outputs.path }}/tools/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          tags: mhgurecomp-builder:ci
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=linux-arm64-tools
          cache-to: type=gha,mode=max,scope=linux-arm64-tools
      - name: Verify tools access as an unprivileged user
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          docker run --rm --platform linux/amd64 --user 65534:65534 \
            --workdir /tmp --entrypoint bash --env "EXPECTED_SOURCE=$SOURCE_SHA" \
            mhgurecomp-builder:ci -euxc '
              [[ $(id -u) == 65534 ]]
              stat -c "%a %u:%g %n" /opt/mhgu /opt/mhgu/docker \
                /opt/mhgu/docker/build.sh /opt/mhgu/docker/check-elf.py
              test -r /opt/mhgu/docker/build.sh
              test -r /opt/mhgu/docker/check-elf.py
              test -r /opt/mhgu/source-revision
              test -r /opt/mhgu/host-packages.tsv
              test -r /opt/mhgu/arm64-packages.tsv
              test -r /opt/mhgu/requirements.txt
              test ! -w /opt/mhgu/docker/build.sh
              [[ $(cat /opt/mhgu/source-revision) == "$EXPECTED_SOURCE" ]]
              bash -n /opt/mhgu/docker/build.sh
              python3 /opt/mhgu/docker/check-elf.py aarch64
              echo "Unprivileged tools access: OK"
            '
      - name: Mandatory public runtime and ARM64 QEMU tests
        run: |
          bash tools/build-linux-release.sh --check --version 0 --jobs 2 \
            --image mhgurecomp-builder:ci --skip-image-build
      - name: Save only the tested tools image
        # Export the candidate too: promotion must publish this SAME image.
        id: image
        run: |
          id=$(docker image inspect mhgurecomp-builder:ci --format '{{.Id}}')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          docker image save mhgurecomp-builder:ci | gzip > "$RUNNER_TEMP/tools-image.tar.gz"
          echo "Tested image ID: \`$id\`; source: \`${{ steps.source.outputs.sha }}\`; artifact: \`tested-tools-${{ steps.source.outputs.sha }}\`; run: \`$GITHUB_RUN_ID\`. Manual publication recovery is available for one day." >> "$GITHUB_STEP_SUMMARY"
      - name: Transport the tested image (no game outputs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tools-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/tools-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Show disk use
        if: always()
        run: df -h .
