name: Synchronize upstream after read-only ARM64 validation

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      retry_validation:
        description: Retry an unchanged blocker or failed candidate explicitly
        type: boolean
        default: false
      cleanup_legacy:
        description: Delete linux-arm64-0118 only if its exact tip is already in master
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'pablovesnine/MHGURecomp' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      statuses: read
    outputs:
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      should_validate: ${{ steps.prepare.outputs.should_validate }}
      outcome: ${{ steps.prepare.outputs.outcome }}
      base: ${{ steps.prepare.outputs.base }}
      upstream: ${{ steps.prepare.outputs.upstream }}
      policy: ${{ steps.prepare.outputs.policy }}
      key: ${{ steps.prepare.outputs.key }}
      message: ${{ steps.prepare.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Copy trusted maintenance code before changing checkout
        run: cp tools/sync-upstream.py "$RUNNER_TEMP/sync-upstream.py"
      - name: Prepare policy-aware two-parent merge (no PR)
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ inputs.retry_validation }}
          CLEANUP_LEGACY: ${{ inputs.cleanup_legacy }}
        run: |
          args=()
          if [[ "$RETRY" == true ]]; then args+=(--retry); fi
          if [[ "$CLEANUP_LEGACY" == true ]]; then args+=(--cleanup-legacy); fi
          python3 "$RUNNER_TEMP/sync-upstream.py" prepare --repo "$GITHUB_WORKSPACE" "${args[@]}"

  queue:
    needs: prepare
    if: needs.prepare.outputs.should_validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark exact candidate pending without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/pablovesnine/MHGURecomp/statuses/$CANDIDATE_SHA" \
            --method POST -f state=pending -f context=upstream-sync/aarch64 \
            -f description='Read-only ARM64 validation queued' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  validate:
    needs: [prepare, queue]
    if: needs.prepare.outputs.should_validate == 'true'
    permissions:
      contents: read
    # Reusable implementation resolves at THIS trusted workflow SHA.
    # Candidate scripts never receive a token with Git/API/package write access.
    uses: ./.github/workflows/linux-builder.yml
    with:
      candidate_ref: ${{ needs.prepare.outputs.candidate_sha }}

  validation_status:
    needs: [prepare, queue, validate]
    if: always() && needs.prepare.outputs.should_validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report exact-SHA validation result from trusted code
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.candidate_sha }}
          KEY: ${{ needs.prepare.outputs.key }}
          RESULT: ${{ needs.validate.result }}
        run: |
          python3 tools/sync-upstream.py report --phase validation \
            --sha "$SHA" --key "$KEY" --result "$RESULT"

  promote:
    needs: [prepare, validate, validation_status]
    if: >-
      needs.validate.result == 'success' &&
      needs.validation_status.result == 'success' &&
      needs.validate.outputs.source_sha == needs.prepare.outputs.candidate_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Promote only this tested merge with expected master and policy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.candidate_sha }}
          BASE: ${{ needs.prepare.outputs.base }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          POLICY: ${{ needs.prepare.outputs.policy }}
          RESULT: ${{ needs.validate.result }}
        run: |
          python3 tools/sync-upstream.py promote --repo "$GITHUB_WORKSPACE" \
            --sha "$SHA" --base "$BASE" --upstream "$UPSTREAM" --policy "$POLICY" --result "$RESULT"

  publish:
    needs: [prepare, validate, promote]
    if: needs.promote.result == 'success'
    permissions:
      contents: read
      actions: read
      statuses: read
      packages: write
    # Explicit call: a GITHUB_TOKEN master push does NOT trigger linux-ci.
    uses: ./.github/workflows/linux-publisher.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      image_id: ${{ needs.validate.outputs.image_id }}
      artifact_name: ${{ needs.validate.outputs.artifact_name }}

  report:
    needs: [prepare, validate, validation_status, promote, publish]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse, reopen or close issue 2 without duplicate notifications
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.candidate_sha }}
          KEY: ${{ needs.prepare.outputs.key }}
          OUTCOME: ${{ needs.prepare.outputs.outcome }}
          MESSAGE: ${{ needs.prepare.outputs.message }}
          PROMOTION: ${{ needs.promote.result }}
          PUBLICATION: ${{ needs.publish.result }}
        run: |
          python3 tools/sync-upstream.py report --sha "$SHA" --key "$KEY" \
            --outcome "$OUTCOME" --message "$MESSAGE" \
            --promotion "$PROMOTION" --publication "$PUBLICATION"
