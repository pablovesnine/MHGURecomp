name: Publish a validated master tools image

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_id:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current master SHA from the successful validation
        type: string
        required: true
      image_id:
        description: Tested sha256 image ID from that validation
        type: string
        required: true
      artifact_name:
        description: tested-tools-FULL_SOURCE_SHA
        type: string
        required: true
      artifact_run_id:
        description: Successful validation run containing the one-day image artifact
        type: string
        required: true

permissions:
  contents: read
  actions: read
  statuses: read
  packages: write

concurrency:
  group: publish-tools-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pablovesnine/MHGURecomp' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Trusted workflow only. Never checkout, rebuild, or execute a container.
      - name: Verify exact publication coordinates and trusted validation run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TESTED_IMAGE_ID: ${{ inputs.image_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id || github.run_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT" == "tested-tools-$SOURCE_SHA" ]]
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          current=$(gh api repos/pablovesnine/MHGURecomp/git/ref/heads/master --jq .object.sha)
          [[ "$current" == "$SOURCE_SHA" ]]
          # Manual recovery may only retrieve master CI/sync artifacts, never PR artifacts.
          gh api "repos/pablovesnine/MHGURecomp/actions/runs/$ARTIFACT_RUN" > "$RUNNER_TEMP/validation-run.json"
          gh api "repos/pablovesnine/MHGURecomp/actions/runs/$ARTIFACT_RUN/jobs?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/validation-jobs.json"
          gh api "repos/pablovesnine/MHGURecomp/commits/$SOURCE_SHA/statuses?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/validation-statuses.json"
          python3 - "$RUNNER_TEMP" "$ARTIFACT_RUN" "$GITHUB_RUN_ID" "$SOURCE_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          run = json.loads((root / "validation-run.json").read_text())
          assert run["head_repository"]["full_name"] == "pablovesnine/MHGURecomp"
          assert run["head_branch"] == "master"
          assert run["event"] in ("push", "schedule", "workflow_dispatch")
          assert run["path"] in (".github/workflows/linux-ci.yml", ".github/workflows/upstream-sync.yml")
          # Current run is still executing. An earlier run may have failed AFTER
          # validation/promotion, which is precisely the recoverable case.
          assert run["status"] == "completed" or sys.argv[2] == sys.argv[3]
          pages = json.loads((root / "validation-jobs.json").read_text())
          jobs = [j for page in pages for j in page["jobs"]]
          checks = [j for j in jobs if j["name"].endswith("AArch64 without game data (amd64 host)")]
          assert len(checks) == 1 and checks[0]["conclusion"] == "success"
          if run["path"] == ".github/workflows/linux-ci.yml":
              assert run["head_sha"] == sys.argv[4]
          else:
              pages = json.loads((root / "validation-statuses.json").read_text())
              statuses = [s for page in pages for s in page]
              expected_url = "https://github.com/pablovesnine/MHGURecomp/actions/runs/" + sys.argv[2]
              assert any(s["context"] == "upstream-sync/aarch64" and
                         s["state"] == "success" and s["target_url"] == expected_url
                         for s in statuses)
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/tested-image
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Verify source, load tested image, publish and confirm digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TESTED_IMAGE_ID: ${{ inputs.image_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          gzip -dc "$RUNNER_TEMP/tested-image/tools-image.tar.gz" | docker image load
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{.Id}}')" == "$TESTED_IMAGE_ID" ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$SOURCE_SHA" ]]
          [[ "$(docker image inspect mhgurecomp-builder:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" == https://github.com/pablovesnine/MHGURecomp ]]
          image=ghcr.io/pablovesnine/mhgurecomp-builder
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker image tag mhgurecomp-builder:ci "$image:$SOURCE_SHA"
          # Check again immediately before the external write.
          current=$(gh api repos/pablovesnine/MHGURecomp/git/ref/heads/master --jq .object.sha)
          [[ "$current" == "$SOURCE_SHA" ]]
          docker image push "$image:$SOURCE_SHA" | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n 1 | cut -d' ' -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$remote" == "$digest" ]]
          # Also confirm that the immutable-tag manifest is publicly readable.
          docker logout ghcr.io
          remote=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$remote" == "$digest" ]]
          echo "Published \`$image:$SOURCE_SHA\` at \`$digest\` (tested image ID: \`$TESTED_IMAGE_ID\`)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
